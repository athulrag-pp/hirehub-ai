<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${jobId != null ? 'Edit Job - HireHub AI' : 'Post New Job - HireHub AI'}">Job Form - HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border: none; border-radius: 12px; }
        footer { background-color: #212529; color: #adb5bd; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-2"></i>HireHub AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/jobs"><i class="bi bi-search me-1"></i>Browse Jobs</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card form-card shadow-sm p-4 bg-white">
                <h3 class="fw-bold mb-1" th:text="${jobId != null ? 'Edit Job Posting' : 'Post a New Job'}">Post a Job</h3>
                <p class="text-muted mb-4">Provide detailed information to attract top talent.</p>

                <form th:action="${jobId != null ? '/employer/jobs/' + jobId : '/employer/jobs'}" th:object="${jobDto}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Job Title *</label>
                        <input type="text" class="form-control form-control-lg" id="title" th:field="*{title}" placeholder="e.g. Senior Java Developer" required/>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title Error</div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="company" class="form-label fw-semibold">Company Name *</label>
                            <input type="text" class="form-control" id="company" th:field="*{company}" placeholder="e.g. TechCorp Inc." required/>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('company')}" th:errors="*{company}">Company Error</div>
                        </div>
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-semibold">Location *</label>
                            <input type="text" class="form-control" id="location" th:field="*{location}" placeholder="e.g. Remote, San Francisco, CA" required/>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('location')}" th:errors="*{location}">Location Error</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="jobType" class="form-label fw-semibold">Job Type</label>
                            <select class="form-select" id="jobType" th:field="*{jobType}">
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract">Contract</option>
                                <option value="Remote">Remote</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="experienceLevel" class="form-label fw-semibold">Experience Level</label>
                            <select class="form-select" id="experienceLevel" th:field="*{experienceLevel}">
                                <option value="Entry">Entry Level</option>
                                <option value="Mid">Mid Level</option>
                                <option value="Senior">Senior Level</option>
                                <option value="Lead">Lead / Executive</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="salary" class="form-label fw-semibold">Salary Range</label>
                            <input type="text" class="form-control" id="salary" th:field="*{salary}" placeholder="e.g. $100,000 - $130,000"/>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="deadline" class="form-label fw-semibold">Application Deadline</label>
                        <input type="datetime-local" class="form-control" id="deadline" th:field="*{deadline}"/>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Job Description *</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="6" placeholder="Describe the role responsibilities, team environment, and goals..." required></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description Error</div>
                    </div>

                    <div class="mb-4">
                        <label for="requirements" class="form-label fw-semibold">Requirements &amp; Qualifications</label>
                        <textarea class="form-control" id="requirements" th:field="*{requirements}" rows="4" placeholder="List required skills, education, certifications, and experience..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/dashboard" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg px-4"><i class="bi bi-check-circle me-1"></i>Save Job Posting</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2025 HireHub AI. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
