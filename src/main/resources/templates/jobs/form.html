<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${jobId != null} ? 'Edit Job | HireHub AI' : 'Post a Job | HireHub AI'">Job Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 p-4">
                <h3 class="fw-bold mb-4" th:text="${jobId != null} ? 'Edit Job Posting' : 'Post a New Job'"></h3>

                <form th:action="${jobId != null} ? @{/employer/jobs/{id}(id=${jobId})} : @{/employer/jobs}"
                      th:object="${jobDto}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Job Title *</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="e.g. Senior Software Engineer"/>
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Company Name *</label>
                            <input type="text" th:field="*{company}" class="form-control"
                                   th:classappend="${#fields.hasErrors('company')} ? 'is-invalid'"
                                   placeholder="e.g. Acme Corp"/>
                            <div class="invalid-feedback" th:errors="*{company}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Location *</label>
                            <input type="text" th:field="*{location}" class="form-control"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                                   placeholder="e.g. New York, NY or Remote"/>
                            <div class="invalid-feedback" th:errors="*{location}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Salary Range</label>
                            <input type="text" th:field="*{salary}" class="form-control"
                                   placeholder="e.g. $80,000 - $120,000"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Job Type</label>
                            <select th:field="*{jobType}" class="form-select">
                                <option value="">Select type...</option>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract">Contract</option>
                                <option value="Remote">Remote</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Experience Level</label>
                            <select th:field="*{experienceLevel}" class="form-select">
                                <option value="">Select level...</option>
                                <option value="Entry Level">Entry Level</option>
                                <option value="Mid Level">Mid Level</option>
                                <option value="Senior Level">Senior Level</option>
                                <option value="Lead / Manager">Lead / Manager</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Description *</label>
                            <textarea th:field="*{description}" class="form-control" rows="6"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      placeholder="Describe the role, responsibilities, and what makes this opportunity exciting..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Requirements</label>
                            <textarea th:field="*{requirements}" class="form-control" rows="4"
                                      placeholder="List required skills, qualifications, and experience..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Application Deadline</label>
                            <input type="datetime-local" th:field="*{deadline}" class="form-control"/>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="${jobId != null} ? 'Save Changes' : 'Post Job'"></span>
                        </button>
                        <a href="/dashboard" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
