<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Browse Jobs | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        .job-card { transition: transform 0.2s, box-shadow 0.2s; border: none; border-radius: 12px; }
        .job-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard" sec:authorize="isAuthenticated()">Dashboard</a>
            <a class="nav-link" href="/login" sec:authorize="isAnonymous()">Login</a>
            <a class="btn btn-primary btn-sm ms-2" href="/register" sec:authorize="isAnonymous()">Sign Up</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="fw-bold">Browse Jobs</h2>
            <p class="text-muted" th:text="${jobs.totalElements} + ' jobs found'"></p>
        </div>
    </div>

    <!-- Search bar -->
    <form action="/jobs" method="get" class="row g-2 mb-5">
        <div class="col-md-9">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" name="keyword" class="form-control form-control-lg border-start-0"
                       th:value="${keyword}" placeholder="Search by title, skill, or company..."/>
            </div>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary btn-lg w-100">Search</button>
        </div>
    </form>

    <!-- Job cards -->
    <div th:if="${!jobs.content.isEmpty()}">
        <div class="row g-4">
            <div class="col-md-6" th:each="job : ${jobs.content}">
                <div class="card job-card shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-primary-subtle text-primary rounded-pill"
                                  th:text="${job.jobType ?: 'Full-time'}"></span>
                            <small class="text-muted"
                                   th:text="${#temporals.format(job.postedAt, 'MMM d, yyyy')}"></small>
                        </div>
                        <h5 class="fw-bold mb-1" th:text="${job.title}"></h5>
                        <p class="text-muted mb-1"><i class="bi bi-building me-1"></i><span th:text="${job.company}"></span></p>
                        <p class="text-muted mb-2"><i class="bi bi-geo-alt me-1"></i><span th:text="${job.location}"></span></p>
                        <p th:if="${job.salary}" class="mb-2 text-success fw-semibold">
                            <i class="bi bi-cash me-1"></i><span th:text="${job.salary}"></span>
                        </p>
                        <p class="text-muted small mb-3"
                           th:text="${#strings.abbreviate(job.description, 120)}"></p>
                        <div class="d-flex gap-2">
                            <span th:if="${job.experienceLevel}"
                                  class="badge bg-secondary-subtle text-secondary"
                                  th:text="${job.experienceLevel}"></span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0 pb-3 px-4">
                        <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-outline-primary w-100">
                            View Details <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav class="mt-5" th:if="${jobs.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/jobs(keyword=${keyword}, page=${currentPage - 1})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, jobs.totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/jobs(keyword=${keyword}, page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == jobs.totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/jobs(keyword=${keyword}, page=${currentPage + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:if="${jobs.content.isEmpty()}" class="text-center py-5">
        <i class="bi bi-search display-3 text-muted"></i>
        <h4 class="mt-3 text-muted">No jobs found</h4>
        <p class="text-muted">Try a different keyword or <a href="/jobs">browse all jobs</a>.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
