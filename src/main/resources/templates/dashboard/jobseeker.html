<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Dashboard | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        .status-PENDING { background-color: #fff3cd; color: #856404; }
        .status-REVIEWED { background-color: #cff4fc; color: #055160; }
        .status-SHORTLISTED { background-color: #d1e7dd; color: #0a3622; }
        .status-REJECTED { background-color: #f8d7da; color: #842029; }
        .status-HIRED { background-color: #d1e7dd; color: #0a3622; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/jobs">Browse Jobs</a>
            <a class="nav-link" href="/profile">Profile</a>
            <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Welcome, <span th:text="${user.fullName}"></span></h2>
            <p class="text-muted mb-0">Job Seeker Dashboard</p>
        </div>
        <a href="/jobs" class="btn btn-primary">
            <i class="bi bi-search me-1"></i>Find Jobs
        </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-5">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-send display-5 text-primary mb-2"></i>
                <h3 class="fw-bold" th:text="${myApplications.size()}">0</h3>
                <p class="text-muted mb-0">Applied</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-eye display-5 text-info mb-2"></i>
                <h3 class="fw-bold"
                    th:text="${myApplications.stream().filter(a -> a.status.name() == 'REVIEWED' or a.status.name() == 'SHORTLISTED').count()}">0</h3>
                <p class="text-muted mb-0">In Progress</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-trophy display-5 text-success mb-2"></i>
                <h3 class="fw-bold"
                    th:text="${myApplications.stream().filter(a -> a.status.name() == 'HIRED').count()}">0</h3>
                <p class="text-muted mb-0">Hired</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-x-circle display-5 text-danger mb-2"></i>
                <h3 class="fw-bold"
                    th:text="${myApplications.stream().filter(a -> a.status.name() == 'REJECTED').count()}">0</h3>
                <p class="text-muted mb-0">Not Selected</p>
            </div>
        </div>
    </div>

    <h4 class="fw-bold mb-3">My Applications</h4>

    <div th:if="${myApplications.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox display-3"></i>
        <p class="mt-3">You haven't applied to any jobs yet. <a href="/jobs">Start browsing!</a></p>
    </div>

    <div th:if="${!myApplications.isEmpty()}" class="row g-3">
        <div class="col-12" th:each="app : ${myApplications}">
            <div class="card border-0 shadow-sm rounded-3 p-3">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <a th:href="@{/jobs/{id}(id=${app.jobPosting.id})}" class="text-decoration-none">
                            <h5 class="fw-bold mb-1" th:text="${app.jobPosting.title}"></h5>
                        </a>
                        <p class="text-muted mb-0">
                            <i class="bi bi-building me-1"></i><span th:text="${app.jobPosting.company}"></span>
                            <span class="ms-3"><i class="bi bi-geo-alt me-1"></i><span th:text="${app.jobPosting.location}"></span></span>
                        </p>
                    </div>
                    <div class="col-md-3 text-center">
                        <span class="badge rounded-pill px-3 py-2"
                              th:classappend="'status-' + ${app.status.name()}"
                              th:text="${app.status.name()}"></span>
                        <br/>
                        <small class="text-muted" th:text="'Applied: ' + ${#temporals.format(app.appliedAt, 'MMM d, yyyy')}"></small>
                    </div>
                    <div class="col-md-3 text-end">
                        <form th:action="@{/applications/{id}/withdraw(id=${app.id})}" method="post"
                              onsubmit="return confirm('Withdraw this application?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-x-lg me-1"></i>Withdraw
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
