<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Employer Dashboard | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/jobs">Browse Jobs</a>
            <a class="nav-link" href="/profile">Profile</a>
            <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Welcome, <span th:text="${user.fullName}"></span></h2>
            <p class="text-muted mb-0" th:text="${user.companyName ?: 'Employer Dashboard'}"></p>
        </div>
        <a href="/employer/jobs/new" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Post a Job
        </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-5">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-briefcase display-5 text-primary mb-2"></i>
                <h3 class="fw-bold" th:text="${myJobs.size()}">0</h3>
                <p class="text-muted mb-0">Total Postings</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-eye display-5 text-success mb-2"></i>
                <h3 class="fw-bold" th:text="${myJobs.stream().filter(j -> j.active).count()}">0</h3>
                <p class="text-muted mb-0">Active Listings</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-3 p-4 text-center">
                <i class="bi bi-eye-slash display-5 text-warning mb-2"></i>
                <h3 class="fw-bold" th:text="${myJobs.stream().filter(j -> !j.active).count()}">0</h3>
                <p class="text-muted mb-0">Inactive Listings</p>
            </div>
        </div>
    </div>

    <h4 class="fw-bold mb-3">My Job Postings</h4>

    <div th:if="${myJobs.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox display-3"></i>
        <p class="mt-3">No job postings yet. <a href="/employer/jobs/new">Post your first job!</a></p>
    </div>

    <div th:if="${!myJobs.isEmpty()}" class="row g-3">
        <div class="col-12" th:each="job : ${myJobs}">
            <div class="card border-0 shadow-sm rounded-3 p-3">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h5 class="fw-bold mb-1" th:text="${job.title}"></h5>
                        <p class="text-muted mb-0">
                            <i class="bi bi-geo-alt me-1"></i><span th:text="${job.location}"></span>
                            <span class="ms-3"><i class="bi bi-clock me-1"></i><span th:text="${job.jobType ?: 'N/A'}"></span></span>
                        </p>
                    </div>
                    <div class="col-md-2 text-center">
                        <span th:if="${job.active}" class="badge bg-success rounded-pill">Active</span>
                        <span th:unless="${job.active}" class="badge bg-secondary rounded-pill">Inactive</span>
                        <br/>
                        <small class="text-muted" th:text="${#temporals.format(job.postedAt, 'MMM d, yyyy')}"></small>
                    </div>
                    <div class="col-md-4 text-end d-flex gap-2 justify-content-end flex-wrap">
                        <a th:href="@{/employer/jobs/{id}/applications(id=${job.id})}"
                           class="btn btn-outline-info btn-sm">
                            <i class="bi bi-people me-1"></i>Applications
                        </a>
                        <a th:href="@{/employer/jobs/{id}/edit(id=${job.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/employer/jobs/{id}/toggle(id=${job.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-warning btn-sm"
                                    th:text="${job.active} ? 'Deactivate' : 'Activate'"></button>
                        </form>
                        <form th:action="@{/employer/jobs/{id}/delete(id=${job.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this job posting?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
