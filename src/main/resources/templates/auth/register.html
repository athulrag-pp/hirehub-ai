<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="col-md-6">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <h2 class="fw-bold"><i class="bi bi-briefcase-fill text-primary me-2"></i>HireHub AI</h2>
            </a>
            <p class="text-muted">Create your account</p>
        </div>

        <div class="card border-0 shadow-sm rounded-3 p-4">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${registerDto}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Role selector -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">I am a...</label>
                    <div class="row g-3">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="roleJobseeker"
                                   value="ROLE_JOBSEEKER" th:checked="${registerDto.role?.name() == 'ROLE_JOBSEEKER'}" required/>
                            <label class="btn btn-outline-primary w-100 py-3" for="roleJobseeker">
                                <i class="bi bi-person-workspace d-block mb-1 fs-4"></i>
                                Job Seeker
                            </label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="roleEmployer"
                                   value="ROLE_EMPLOYER" th:checked="${registerDto.role?.name() == 'ROLE_EMPLOYER'}"/>
                            <label class="btn btn-outline-success w-100 py-3" for="roleEmployer">
                                <i class="bi bi-building d-block mb-1 fs-4"></i>
                                Employer
                            </label>
                        </div>
                    </div>
                    <div th:if="${#fields.hasErrors('role')}" class="text-danger small mt-1" th:errors="*{role}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           placeholder="John Doe"/>
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="you@example.com"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <!-- Company name (employer only) -->
                <div class="mb-3" id="companyGroup">
                    <label class="form-label fw-semibold">Company Name <span class="text-muted">(Employers)</span></label>
                    <input type="text" th:field="*{companyName}" class="form-control" placeholder="Acme Corp"/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone <span class="text-muted">(optional)</span></label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="+1 555 000 0000"/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="Min. 6 characters"/>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="Repeat your password"/>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-person-plus me-1"></i>Create Account
                </button>
            </form>
        </div>

        <p class="text-center mt-3 text-muted">
            Already have an account? <a href="/login" class="text-primary fw-semibold">Sign In</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
