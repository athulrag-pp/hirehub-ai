<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Profile - HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background-color: #f8f9fa; }
        .profile-card { border: none; border-radius: 12px; }
        footer { background-color: #212529; color: #adb5bd; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-2"></i>HireHub AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/jobs"><i class="bi bi-search me-1"></i>Browse Jobs</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span th:text="${user.fullName}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Alerts -->
<div class="container mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card profile-card shadow-sm p-4 bg-white">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary text-white rounded-circle p-3 me-3 display-6" style="width:70px; height:70px; display:flex; align-items:center; justify-content:center;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-1" th:text="${user.fullName}">User Full Name</h3>
                        <span class="badge bg-primary" th:text="${user.role}">Role</span>
                        <span class="text-muted ms-2" th:text="${user.email}">user@example.com</span>
                    </div>
                </div>

                <hr class="my-4"/>

                <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Update Account Details</h5>

                <form th:action="@{/profile}" th:object="${profileDto}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Full Name *</label>
                        <input type="text" class="form-control form-control-lg" id="fullName" th:field="*{fullName}" required/>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="+1 (555) 000-0000"/>
                        </div>
                        <div class="col-md-6" th:if="${user.role.name() == 'ROLE_EMPLOYER'}">
                            <label for="companyName" class="form-label fw-semibold">Company Name</label>
                            <input type="text" class="form-control" id="companyName" th:field="*{companyName}" placeholder="e.g. Acme Corp"/>
                        </div>
                    </div>

                    <div class="mb-3" th:if="${user.role.name() == 'ROLE_JOBSEEKER'}">
                        <label for="resumeUrl" class="form-label fw-semibold">Resume URL</label>
                        <input type="url" class="form-control" id="resumeUrl" th:field="*{resumeUrl}" placeholder="https://linkedin.com/in/... or Google Drive URL"/>
                        <div class="form-text">Direct URL to your public resume or portfolio document.</div>
                    </div>

                    <div class="mb-4">
                        <label for="bio" class="form-label fw-semibold">Bio / Professional Summary</label>
                        <textarea class="form-control" id="bio" th:field="*{bio}" rows="4" placeholder="Tell employers or job seekers about yourself..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary btn-lg px-4"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2025 HireHub AI. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
