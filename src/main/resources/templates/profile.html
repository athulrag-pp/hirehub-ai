<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Profile | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-3 p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3"
                         style="width:60px;height:60px;font-size:1.5rem;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${user.fullName}"></h4>
                        <span class="badge bg-primary-subtle text-primary"
                              th:text="${user.role.name().replace('ROLE_', '')}"></span>
                    </div>
                </div>

                <form th:action="@{/profile}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control bg-light" th:value="${user.email}" disabled/>
                        <div class="form-text">Email cannot be changed.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone</label>
                        <input type="text" name="phone" class="form-control" th:value="${user.phone}"
                               placeholder="+1 555 000 0000"/>
                    </div>

                    <div class="mb-3" th:if="${user.role.name() == 'ROLE_EMPLOYER'}">
                        <label class="form-label fw-semibold">Company Name</label>
                        <input type="text" name="companyName" class="form-control" th:value="${user.companyName}"
                               placeholder="Your company name"/>
                    </div>

                    <div class="mb-3" th:if="${user.role.name() == 'ROLE_JOBSEEKER'}">
                        <label class="form-label fw-semibold">Resume / Portfolio URL</label>
                        <input type="url" name="resumeUrl" class="form-control" th:value="${user.resumeUrl}"
                               placeholder="https://linkedin.com/in/yourname"/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Bio</label>
                        <textarea name="bio" class="form-control" rows="4"
                                  placeholder="Tell employers or candidates about yourself..."
                                  th:text="${user.bio}"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-save me-1"></i>Save Profile
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
