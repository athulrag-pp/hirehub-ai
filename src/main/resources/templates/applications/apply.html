<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'Apply for ' + ${job.title} + ' | HireHub AI'">Apply | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <!-- Job summary -->
            <div class="card border-0 shadow-sm rounded-3 p-4 mb-4 bg-primary text-white">
                <h4 class="fw-bold mb-1" th:text="${job.title}"></h4>
                <p class="mb-0 opacity-75">
                    <i class="bi bi-building me-1"></i><span th:text="${job.company}"></span>
                    <span class="mx-2">·</span>
                    <i class="bi bi-geo-alt me-1"></i><span th:text="${job.location}"></span>
                </p>
            </div>

            <div class="card border-0 shadow-sm rounded-3 p-4">
                <h5 class="fw-bold mb-4">Your Application</h5>

                <form th:action="@{/applications/apply/{id}(id=${job.id})}"
                      th:object="${appDto}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Applying as</label>
                        <input type="text" class="form-control bg-light"
                               th:value="${user.fullName} + ' (' + ${user.email} + ')'" disabled/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Resume URL <span class="text-muted">(optional)</span></label>
                        <input type="url" th:field="*{resumeUrl}" class="form-control"
                               placeholder="https://linkedin.com/in/yourprofile or Google Drive link"
                               th:value="${user.resumeUrl}"/>
                        <div class="form-text">Link to your resume, LinkedIn, or portfolio.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Cover Letter <span class="text-muted">(optional)</span></label>
                        <textarea th:field="*{coverLetter}" class="form-control" rows="6"
                                  placeholder="Introduce yourself and explain why you're a great fit for this role..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-send me-1"></i>Submit Application
                        </button>
                        <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
