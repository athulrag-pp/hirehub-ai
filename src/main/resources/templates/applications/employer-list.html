<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Applications | HireHub AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-briefcase-fill text-primary me-1"></i>HireHub AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="mb-4">
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm mb-3">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
        <h3 class="fw-bold mb-1">Applications for: <span th:text="${job.title}" class="text-primary"></span></h3>
        <p class="text-muted" th:text="${applications.size()} + ' application(s) received'"></p>
    </div>

    <div th:if="${applications.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox display-3"></i>
        <p class="mt-3">No applications yet for this job.</p>
    </div>

    <div th:if="${!applications.isEmpty()}" class="row g-3">
        <div class="col-12" th:each="app : ${applications}">
            <div class="card border-0 shadow-sm rounded-3 p-4">
                <div class="row align-items-start">
                    <div class="col-md-5">
                        <h5 class="fw-bold mb-1" th:text="${app.applicant.fullName}"></h5>
                        <p class="text-muted mb-1"><i class="bi bi-envelope me-1"></i><span th:text="${app.applicant.email}"></span></p>
                        <p class="text-muted mb-0 small" th:text="'Applied: ' + ${#temporals.format(app.appliedAt, 'MMM d, yyyy h:mm a')}"></p>
                        <a th:if="${app.resumeUrl}" th:href="${app.resumeUrl}" target="_blank"
                           class="btn btn-outline-info btn-sm mt-2">
                            <i class="bi bi-file-person me-1"></i>View Resume
                        </a>
                    </div>
                    <div class="col-md-4">
                        <div th:if="${app.coverLetter}" class="mt-2 mt-md-0">
                            <p class="fw-semibold mb-1 small text-muted">COVER LETTER</p>
                            <p class="small text-muted border rounded p-2 bg-light"
                               th:text="${#strings.abbreviate(app.coverLetter, 200)}"></p>
                        </div>
                        <p th:unless="${app.coverLetter}" class="text-muted small fst-italic">No cover letter provided.</p>
                    </div>
                    <div class="col-md-3 text-end">
                        <div class="mb-2">
                            <span class="badge rounded-pill px-3 py-2 fs-6"
                                  th:classappend="${app.status.name() == 'HIRED'} ? 'bg-success' :
                                                  (${app.status.name() == 'SHORTLISTED'} ? 'bg-info' :
                                                  (${app.status.name() == 'REJECTED'} ? 'bg-danger' :
                                                  (${app.status.name() == 'REVIEWED'} ? 'bg-primary' : 'bg-warning text-dark')))"
                                  th:text="${app.status.name()}"></span>
                        </div>
                        <form th:action="@{/employer/applications/{id}/status(id=${app.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="jobId" th:value="${job.id}"/>
                            <select name="status" class="form-select form-select-sm mb-2"
                                    th:value="${app.status}">
                                <option value="PENDING" th:selected="${app.status.name() == 'PENDING'}">Pending</option>
                                <option value="REVIEWED" th:selected="${app.status.name() == 'REVIEWED'}">Reviewed</option>
                                <option value="SHORTLISTED" th:selected="${app.status.name() == 'SHORTLISTED'}">Shortlisted</option>
                                <option value="REJECTED" th:selected="${app.status.name() == 'REJECTED'}">Rejected</option>
                                <option value="HIRED" th:selected="${app.status.name() == 'HIRED'}">Hired</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm w-100">Update Status</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
