spring:
  application:
    name: hirehub-ai

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:hirehubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

logging:
  level:
    com.hirehub: INFO

